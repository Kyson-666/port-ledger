services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "127.0.0.1:8443:443"
      - "9000/tcp"
      - "7000-7002:7000-7002"
  db:
    image: mysql:8
    ports:
      - target: 5432
        published: 15432
        protocol: tcp
  dyn:
    image: busybox
    ports:
      - "${PORT}:80"
  nopublish:
    image: redis:7
version: "3.8"
